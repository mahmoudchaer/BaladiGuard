name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock

      - name: Run backend lint
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff check ../scripts/sync_env.py

      - name: Check backend formatting
        working-directory: backend
        run: |
          python -m ruff format --check .
          python -m ruff format --check ../scripts/sync_env.py

      - name: Validate mock ticket data
        working-directory: backend
        run: PYTHONPATH=. python scripts/validate_mock_tickets.py

      - name: Run AI intake regression subset
        working-directory: backend
        run: python -m pytest -m ai_intake_regression -q

      - name: Run remaining backend tests
        working-directory: backend
        run: python -m pytest -m "not ai_intake_regression"

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Check mobile formatting
        working-directory: mobile
        run: npm run format:check

      - name: Check mobile Expo config
        working-directory: mobile
        run: npm run check:config

      - name: Check mobile Expo Router files
        working-directory: mobile
        run: npm run check:routes

      - name: Run mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

  admin:
    name: Admin dashboard checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Run admin lint
        working-directory: admin
        run: npm run lint

      - name: Check admin formatting
        working-directory: admin
        run: npm run format:check

      - name: Run admin typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Run admin tests
        working-directory: admin
        run: npm test

      - name: Build admin dashboard
        working-directory: admin
        run: npm run build

  citizen-web:
    name: Citizen web checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: citizen-web/package-lock.json

      - name: Install citizen-web dependencies
        working-directory: citizen-web
        run: npm ci

      - name: Run citizen-web lint
        working-directory: citizen-web
        run: npm run lint

      - name: Check citizen-web formatting
        working-directory: citizen-web
        run: npm run format:check

      - name: Run citizen-web typecheck
        working-directory: citizen-web
        run: npm run typecheck

      - name: Run citizen-web tests
        working-directory: citizen-web
        run: npm test

      - name: Build citizen-web
        working-directory: citizen-web
        run: npm run build

      - name: Validate citizen-web CloudFront template
        working-directory: citizen-web
        run: npm run check:cloudfront

      - name: Run citizen-web contract tests
        working-directory: citizen-web
        run: npm run test:contracts

      - name: Run citizen-web integration flows
        working-directory: citizen-web
        run: npm run test:integration

      - name: Install Playwright Chromium
        working-directory: citizen-web
        run: npx playwright install --with-deps chromium

      - name: Run citizen-web browser E2E subset
        working-directory: citizen-web
        run: npm run test:e2e

      - name: Verify production citizen-web bundle
        working-directory: citizen-web
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: https://api.example.test
          VITE_USE_MOCK_DATA: "false"
        run: |
          npm run build
          npm run check:production-build
