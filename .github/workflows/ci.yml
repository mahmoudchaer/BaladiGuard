name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend lint
        working-directory: backend
        run: python -m ruff check .

      - name: Check backend formatting
        working-directory: backend
        run: python -m ruff format --check .

      - name: Validate mock ticket data
        working-directory: backend
        run: PYTHONPATH=. python scripts/validate_mock_tickets.py

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Run mobile lint
        working-directory: mobile
        run: npm run lint

      - name: Check mobile formatting
        working-directory: mobile
        run: npm run format:check

      - name: Run mobile typecheck
        working-directory: mobile
        run: npm run typecheck

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

  admin:
    name: Admin dashboard checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Run admin lint
        working-directory: admin
        run: npm run lint

      - name: Check admin formatting
        working-directory: admin
        run: npm run format:check

      - name: Run admin typecheck
        working-directory: admin
        run: npm run typecheck

      - name: Run admin tests
        working-directory: admin
        run: npm test

      - name: Build admin dashboard
        working-directory: admin
        run: npm run build
