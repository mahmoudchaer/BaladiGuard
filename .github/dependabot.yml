version: 2
updates:
  - package-ecosystem: npm
    directory: /admin
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      admin-production: { dependency-type: production }
      admin-development: { dependency-type: development }
    ignore:
      # typescript-eslint@8 requires TypeScript < 6.1. Revisit when eslint 9/TS-eslint catch up.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      mobile-production: { dependency-type: production }
      mobile-development: { dependency-type: development }
    ignore:
      # Expo 57 + eslint-config-expo still target ESLint 9 / Babel 7 / TypeScript 5.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # react-native-reanimated@4.5 peers RN 0.83–0.86 only.
      - dependency-name: react-native
        versions: [">=0.87.0"]
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      backend-dependencies: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
