[project]
name = "baladiguard-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "ai_intake_regression: deterministic multilingual classification and cleaning regressions",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["app/database/migrations.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/db/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
